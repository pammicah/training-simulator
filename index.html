hen address the real driver. Most of the time: "There's no long-term contract — you can pause or cancel anytime from the app. No lock-in."`},{id:`try_one_first`,category:`Wants to Try First`,title:`"Can I just try one cleaning first?"`,script:`"Absolutely — that's exactly what the Trial option is for. And 91.4% of our jobs are completed by cleaners rated 4.5 stars or higher, so the odds are strongly in your favor. You're also backed by the Homeaglow Guarantee. If you love it, you can move to a membership at any point — no pressure either way."`},{id:`bad_reviews`,category:`Negative Reviews`,title:`"I saw some bad reviews online."`,script:`"I appreciate you bringing that up — 91.4% of our jobs are completed by cleaners rated 4.5 stars or higher, and we collect reviews after every single cleaning to make sure only the best keep getting booked. With over 3 million cleanings completed, there will always be outliers, but you choose your cleaner based on their verified profile and can swap anytime."`},{id:`scam_concern`,category:`Scam Concern`,title:`"This seems like it could be a scam."`,script:`"I completely understand — there are a lot of sketchy services out there. Homeaglow has been in business for 10+ years, completed over 3 million cleanings for 1 million customers, and every cleaner is background checked before they ever join the platform. You can verify everything at homeaglow.com. What specifically gave you that concern?"`},{id:`not_interested`,category:`Not Interested`,title:`"I'm not interested / I don't need this."`,script:`"I completely understand — I'm not here to pressure you. Can I ask what's holding you back? A lot of customers who feel that way are just unsure about the commitment, and once they hear how flexible it is, it clicks. What's the main thing that gives you pause?"`},{id:`wont_use_often`,category:`Won't Use Often`,title:`"I won't use it that often / I don't need regular cleaning."`,script:`"That's totally fine — you schedule through our online dashboard whenever it works for you, and you can reschedule instantly if plans change. If your cleaner ever gets sick or cancels last-minute, we have backup coverage that local competitors can't match. There's no minimum booking requirement — most members start every 4-6 weeks and adjust from there."`}],ee=[{id:`support_24_7`,title:`24/7 Support`,icon:`clock`,script:`Our dedicated customer success team is available 24/7 via live chat and phone to assist with scheduling, cleaner preferences, and adjustments.`},{id:`price_cost`,title:`Price & Cost`,icon:`dollar-sign`,script:`Members save over 60% compared to traditional services. You get transparent member rates of ~$23/hr with zero hidden supply or travel fees.`},{id:`flexibility`,title:`Flexibility`,icon:`calendar`,script:`Need to skip a week or reschedule? Adjust appointment windows online anytime up to 24 hours in advance with zero penalty.`},{id:`top_cleaners`,title:`Top Cleaners`,icon:`star`,script:`All platform cleaners undergo rigorous background checks, identity verification, and average a 4.8-star customer review rating.`},{id:`availability`,title:`Availability`,icon:`check-circle`,script:`Book 365 days a year with reliable backup coverage and instant matching across your local coverage area.`}],te=`Hi (Customer),
